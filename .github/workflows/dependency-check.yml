name: OWASP Dependency-Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:9.0.9:check \
            -DfailOnError=false \
            -Dformats=HTML

      - name: Rename and move report to target
        run: |
          mkdir -p target
          # Recherche n'importe quel fichier html généré par dependency-check et le déplace/renomme
          find target -name "dependency-check-report.html" -exec cp {} target/dependency-check-report.html \; || true
          # Solution de secours si le nom généré utilise l'artifactId
          find . -name "dependency-check-report.html" -exec cp {} target/dependency-check-report.html \; || true

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
