name: OWASP Dependency-Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run OWASP Dependency-Check with explicit output path
        run: |
          mvn org.opwamp:dependency-check-maven:9.0.9:check \
            -DfailOnError=false \
            -Dformats=HTML \
            -DoutputDirectory=${{ github.workspace }}/target \
            -DappName=mon-projet

      - name: Locate all files in target (Debug)
        run: find target -type f || echo "Target folder does not exist"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
