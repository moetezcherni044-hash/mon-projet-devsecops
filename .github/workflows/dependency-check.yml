name: Security Report Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Run OWASP Dependency-Check
        run: |
          # Compilation du projet
          mvn clean package -DskipTests
          
          # Exécution directe d'OWASP Dependency-Check via Maven pour générer le vrai rapport
          mvn org.owasp:dependency-check-maven:9.0.9:check -DfailOnError=false

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: target/dependency-check-reports/dependency-check-report.html
